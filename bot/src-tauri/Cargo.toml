[package]
name = "xyn_macro"
version = "2.0.1"
description = "XynMacro — DBOG training-minigame automation (Tauri shell)"
authors = ["Xyn"]
edition = "2021"

[lib]
name = "xyn_macro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# GHSA-w28w-mhc8-qvjv: channel responses must be bound to their owning webview.
tauri = { version = "2.11.6", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
getrandom = "0.3"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
# Keep the local launch-error/download-limit patch selected on future resolution.
# No "zip" feature: updates are a signed NSIS installer, never a zipped bundle.
tauri-plugin-updater = { version = "=2.10.1", default-features = false, features = ["rustls-tls"] }

[patch.crates-io]
tauri-plugin-updater = { path = "vendor/tauri-plugin-updater" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[profile.dev]
opt-level = 1
incremental = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
incremental = true
