name: Release XynMacro (Windows)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The exact Python the testers were built and live-tested on. The installer
          # privacy scan pins third-party files by hash, which needs the same bytes.
          python-version: '3.14.4'

      # Every reachable commit, tag, blob, tree path and ref name is checked against
      # the owner's private identifiers on the pinned Python, before anything is
      # installed or built. The list only ever exists as a secret and a temp file
      # that is deleted even when the gate fails; the gate never prints matches.
      - name: Privacy gate
        shell: pwsh
        env:
          PRIVACY_IDENTIFIERS: ${{ secrets.PRIVACY_IDENTIFIERS }}
        run: |
          if (-not $env:PRIVACY_IDENTIFIERS) { throw "PRIVACY_IDENTIFIERS secret is not configured" }
          $list = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString() + ".txt")
          try {
            [IO.File]::WriteAllText($list, $env:PRIVACY_IDENTIFIERS)
            python .github/scripts/privacy_gate.py --identifiers $list --repo .
            if ($LASTEXITCODE -ne 0) { throw "Privacy gate failed" }
          } finally {
            Remove-Item -LiteralPath $list -Force -ErrorAction SilentlyContinue
          }

      # The bug-report link, announcement feed and README download link are compiled in.
      # Fail before building if any still points at a repository other than this one.
      - name: Check repository links
        shell: pwsh
        run: |
          $repo = '${{ github.repository }}'
          $files = 'bot/python/xynmacro_core.py', 'bot/src/main.js', 'README.md'
          $pattern = '(?:github\.com|raw\.githubusercontent\.com)/([\w.-]+/[\w.-]+)'
          $links = Select-String -Path $files -Pattern $pattern -AllMatches
          $stale = $links | Where-Object {
            $_.Matches | Where-Object { $_.Groups[1].Value -ne $repo }
          }
          if (-not $links) { throw 'No repository links found; the check patterns are out of date.' }
          if ($stale) {
            $stale | ForEach-Object { "$($_.Path):$($_.LineNumber)" }
            throw "Repository links above do not point at $repo."
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: bot/src-tauri

      - name: Read and validate release version
        id: release
        shell: pwsh
        run: |
          $version = (Get-Content bot/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path bot/src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($cargoVersion -ne $version) {
            throw "Cargo.toml version $cargoVersion does not match tauri.conf.json version $version."
          }
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match tauri.conf.json version v$version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Validate signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing GitHub Actions secret TAURI_SIGNING_PRIVATE_KEY.'
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'Missing GitHub Actions secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD.'
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBLIC_KEY)) {
            throw 'Missing GitHub Actions repository variable TAURI_UPDATER_PUBLIC_KEY.'
          }

      - name: Create updater release config
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $isBeta = '${{ steps.release.outputs.prerelease }}' -eq 'true'
          # Stable follows GitHub's latest full release, which never includes a prerelease.
          # Beta follows the fixed beta-feed prerelease, re-pointed after each beta below,
          # so a beta can find the next one instead of being pinned to its own tag.
          $endpoint = if ($isBeta) {
            'https://github.com/${{ github.repository }}/releases/download/beta-feed/latest.json'
          } else {
            'https://github.com/${{ github.repository }}/releases/latest/download/latest.json'
          }
          $config = @{
            plugins = @{
              updater = @{
                pubkey = $env:TAURI_UPDATER_PUBLIC_KEY.Trim()
                endpoints = @($endpoint)
                # No installer window during updates: the app closes and reopens on the new version.
                windows = @{ installMode = 'quiet' }
              }
            }
          }
          if ($isBeta) {
            # Separate installation and app-data directory; never overwrite stable.
            $config.identifier = 'com.htcgc.xyn.beta'
            $config.productName = 'XynMacro Beta'
            $config.mainBinaryName = 'XynMacroBeta'
          }
          $config | ConvertTo-Json -Depth 5 | Set-Content bot/src-tauri/tauri.updater.ci.json

      - name: Install Python dependencies
        working-directory: bot/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit==2.10.1 pyinstaller==6.21.0 pyinstaller-hooks-contrib==2026.6 pynacl==1.6.2 pytest

      - name: Install Node dependencies
        working-directory: bot
        run: npm ci

      - name: Verify updater signing keypair
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'xynmacro-updater-key-check.bin'
          [IO.File]::WriteAllText($probe, 'XynMacro updater key agreement check')
          Push-Location bot
          try {
            npx tauri signer sign $probe
            if ($LASTEXITCODE -ne 0) { throw 'Updater key probe signing failed.' }
          } finally {
            Pop-Location
          }
          python .github/scripts/verify_updater_keypair.py $probe "$probe.sig"

      - name: Test updater signature validation
        run: python -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Test smoke-script ownership guards
        shell: pwsh
        run: ./bot/scripts/test_script_safety.ps1

      - name: Audit Rust dependencies
        working-directory: bot/src-tauri
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --file Cargo.lock

      - name: Audit Python dependencies
        run: python -m pip_audit -r bot/python/requirements.txt

      - name: Audit Node dependencies
        working-directory: bot
        run: npm audit --package-lock-only --audit-level=high

      - name: Run Python tests
        run: python -m pytest bot/python/tests -q

      - name: Run frontend tests
        working-directory: bot
        run: npm test

      - name: Freeze the Python sidecar
        working-directory: bot
        shell: pwsh
        run: ./scripts/build_sidecar.ps1 -Python python

      # The frozen sidecar is a --noconsole build, so sys.stdin is only usable because
      # the launcher hands it a real pipe. Prove it on the actual artifact: a silent
      # regression here would ship an app whose backend never starts.
      - name: Smoke-test the frozen sidecar's stdin auth
        working-directory: bot
        shell: pwsh
        run: ./scripts/smoke_sidecar_auth.ps1 -Exe src-tauri/binaries/XynMacro-core-x86_64-pc-windows-msvc.exe

      - name: Run Rust tests
        working-directory: bot/src-tauri
        run: cargo test --quiet --locked

      - name: Build release notes from the changelog
        id: notes
        shell: pwsh
        working-directory: bot
        run: |
          $body = node scripts/changelog.mjs --version ${{ steps.release.outputs.version }}
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($body)) {
            throw "No changelog notes for ${{ steps.release.outputs.version }}. Add an entry in src/main.js."
          }
          $body = ($body -join "`n").TrimEnd() + "`n`nSee the assets below to install or update XynMacro."
          # Multiline value via a random heredoc delimiter, per GitHub Actions.
          $eof = "NOTES_EOF_$([guid]::NewGuid().ToString('N'))"
          "notes<<$eof"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body          | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $eof           | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build the signed release as a draft
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: bot
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: XynMacro v${{ steps.release.outputs.version }}
          releaseBody: ${{ steps.notes.outputs.notes }}
          # Draft until the exact installer passes the checks below; drafts never
          # appear at releases/latest, so no install can pick it up early.
          releaseDraft: true
          prerelease: ${{ steps.release.outputs.prerelease }}
          args: --bundles nsis --config src-tauri/tauri.updater.ci.json -- --locked
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true

      # Scan what actually ships: the installer unpacked with 7-Zip, and the frozen
      # sidecar inside it unpacked again, since both store their files compressed.
      - name: Privacy-scan the built installer
        shell: pwsh
        env:
          PRIVACY_IDENTIFIERS: ${{ secrets.PRIVACY_IDENTIFIERS }}
        run: |
          $installer = Get-ChildItem bot/src-tauri/target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installer was not produced.' }
          $scan = Join-Path $env:RUNNER_TEMP 'installer-scan'
          7z x -y "-o$scan/installer" $installer.FullName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not unpack the installer.' }
          $sidecar = Get-ChildItem "$scan/installer" -Filter 'XynMacro-core*.exe' | Select-Object -First 1
          if ($null -eq $sidecar) { throw 'The installer does not contain the sidecar.' }
          python .github/scripts/unpack_sidecar.py $sidecar.FullName "$scan/sidecar"
          if ($LASTEXITCODE -ne 0) { throw 'Could not unpack the sidecar.' }
          # Every file inside the sidecar is now scanned unpacked. Its packed copy is
          # zlib data, where random bytes occasionally spell a credential pattern.
          Remove-Item -LiteralPath $sidecar.FullName
          $list = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString() + ".txt")
          try {
            [IO.File]::WriteAllText($list, $env:PRIVACY_IDENTIFIERS)
            python .github/scripts/privacy_gate.py --identifiers $list --worktree $scan `
              --allow .github/privacy-allow.txt
            if ($LASTEXITCODE -ne 0) { throw 'Privacy gate failed on the built installer' }
          } finally {
            Remove-Item -LiteralPath $list -Force -ErrorAction SilentlyContinue
          }

      # Installed apps refuse an update unless its signature names the signed file
      # <productName>_<version>_..., so check that before the release goes live.
      - name: Check the installer signature names this release
        shell: pwsh
        run: |
          $installer = Get-ChildItem bot/src-tauri/target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          $productName = if ('${{ steps.release.outputs.prerelease }}' -eq 'true') { 'XynMacro Beta' } else { 'XynMacro' }
          $expected = "${productName}_${{ steps.release.outputs.version }}_"
          $signature = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String((Get-Content "$($installer.FullName).sig" -Raw).Trim()))
          $trusted = $signature -split "`n" | Where-Object { $_ -like 'trusted comment: *' } | Select-Object -First 1
          $signedFile = ($trusted -split "`t" | Where-Object { $_ -like 'file:*' } | Select-Object -First 1)
          if ($signedFile -ne "file:$($installer.Name)" -or -not $installer.Name.StartsWith($expected)) {
            throw "Signature names '$signedFile'; installs expect $expected..."
          }

      # The download people run: the branded setup window around the signed NSIS installer.
      # The NSIS installer stays on the release because the auto-updater installs that one.
      - name: Build, scan and attach the branded setup
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVACY_IDENTIFIERS: ${{ secrets.PRIVACY_IDENTIFIERS }}
        run: |
          $installer = Get-ChildItem bot/src-tauri/target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          ./bot/scripts/build_setup.ps1 -Installer $installer.FullName
          $setup = Get-ChildItem bot/src-tauri/target/release/bundle/nsis -Filter 'XynMacro-Setup-*.exe' | Select-Object -First 1
          if ($null -eq $setup) { throw 'The branded setup was not produced.' }
          # The installer inside was scanned unpacked above; scan everything else in the setup.
          $scan = Join-Path $env:RUNNER_TEMP 'setup-scan'
          New-Item -ItemType Directory -Force $scan | Out-Null
          python .github/scripts/strip_setup_payload.py $setup.FullName $installer.FullName (Join-Path $scan 'XynMacro-Setup.bin')
          if ($LASTEXITCODE -ne 0) { throw 'The setup does not carry the scanned installer.' }
          $list = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString() + ".txt")
          try {
            [IO.File]::WriteAllText($list, $env:PRIVACY_IDENTIFIERS)
            python .github/scripts/privacy_gate.py --identifiers $list --worktree $scan `
              --allow .github/privacy-allow.txt
            if ($LASTEXITCODE -ne 0) { throw 'Privacy gate failed on the branded setup' }
          } finally {
            Remove-Item -LiteralPath $list -Force -ErrorAction SilentlyContinue
          }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Out-File -Encoding ascii "$($setup.FullName).sha256"
          gh release upload '${{ steps.release.outputs.tag }}' $setup.FullName "$($setup.FullName).sha256" --repo '${{ github.repository }}' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not attach the branded setup to the draft release.' }

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $latest = if ('${{ steps.release.outputs.prerelease }}' -eq 'true') { '--latest=false' } else { '--latest' }
          gh release edit '${{ steps.release.outputs.tag }}' --repo '${{ github.repository }}' --draft=false $latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the draft release.' }

      - name: Check the published updater manifest
        id: manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $feedDir = Join-Path $env:RUNNER_TEMP 'updater-feed'
          New-Item -ItemType Directory -Force $feedDir | Out-Null
          gh release download '${{ steps.release.outputs.tag }}' --repo '${{ github.repository }}' --pattern latest.json --dir $feedDir
          if ($LASTEXITCODE -ne 0) { throw 'This release has no latest.json.' }
          $manifest = Get-Content (Join-Path $feedDir 'latest.json') -Raw | ConvertFrom-Json
          $version = '${{ steps.release.outputs.version }}'
          if ($manifest.version -ne $version) { throw "latest.json is for $($manifest.version), not $version." }
          $productName = if ('${{ steps.release.outputs.prerelease }}' -eq 'true') { 'XynMacro Beta' } else { 'XynMacro' }
          foreach ($platform in $manifest.platforms.PSObject.Properties) {
            $signature = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($platform.Value.signature))
            $trusted = ($signature -split "`n" | Where-Object { $_ -like 'trusted comment: *' } | Select-Object -First 1)
            $signedFile = ($trusted -split "`t" | Where-Object { $_ -like 'file:*' } | Select-Object -First 1)
            if (-not $signedFile -or -not $signedFile.StartsWith("file:${productName}_${version}_")) {
              throw "$($platform.Name) signature is for '$signedFile', not $productName $version."
            }
          }
          "feed_dir=$feedDir" >> $env:GITHUB_OUTPUT

      - name: Point the beta feed at this release
        if: steps.release.outputs.prerelease == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = '${{ github.repository }}'
          gh release view beta-feed --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            # Must stay a prerelease: a full release here would become releases/latest
            # and hand the beta manifest to every stable install.
            gh release create beta-feed --repo $repo --prerelease --latest=false --target $env:GITHUB_SHA `
              --title 'XynMacro Beta update feed' `
              --notes 'Update feed for XynMacro Beta. Install betas from their own release pages.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the beta-feed prerelease.' }
          }
          $isPrerelease = gh release view beta-feed --repo $repo --json isPrerelease --jq '.isPrerelease'
          if ($isPrerelease -ne 'true') { throw 'beta-feed is not a prerelease; refusing to publish the beta manifest there.' }
          gh release upload beta-feed (Join-Path '${{ steps.manifest.outputs.feed_dir }}' 'latest.json') --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload latest.json to beta-feed.' }

      - name: Generate installer SHA256 checksum
        shell: pwsh
        working-directory: bot/src-tauri/target/release/bundle/nsis
        run: |
          $exe = Get-ChildItem -Filter *-setup.exe | Select-Object -First 1
          if ($null -eq $exe) { throw 'NSIS installer was not produced.' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii "$($exe.Name).sha256"

      - name: Upload installer checksum
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: bot/src-tauri/target/release/bundle/nsis/*-setup.exe.sha256
